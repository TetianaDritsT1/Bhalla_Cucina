<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Base Ecosystem Flashcards</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background: linear-gradient(135deg, #0052FF 0%, #0a0a0a 100%);
        }
        .card-container {
            perspective: 1000px;
            height: 320px;
        }
        .card {
            width: 100%;
            height: 100%;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            position: relative;
            cursor: pointer;
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 1.25rem;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            padding: 2rem;
            text-align: center;
            border: 1px solid rgba(0, 82, 255, 0.3);
        }
        .card-back {
            transform: rotateY(180deg);
        }
        .card-container.is-flipped .card {
            transform: rotateY(180deg);
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center p-4 text-white">

    <div class="w-full max-w-xl bg-gray-900/95 border border-blue-500/30 rounded-3xl p-8 shadow-2xl backdrop-blur-md">
        <div class="flex items-center justify-center space-x-2 mb-2">
            <span class="text-2xl">🔵</span>
            <h1 class="text-2xl font-bold tracking-tight text-white">Base Builder Academy</h1>
        </div>
        <p class="text-center text-blue-300 text-xs mb-6 font-mono">Флеш-карточки по разработке в сети Base & L2</p>

        <!-- Блок прогресса -->
        <div id="progressDisplay" class="text-xs font-mono font-semibold text-blue-400 mb-4 text-center bg-blue-500/10 py-1.5 rounded-lg border border-blue-500/20">Карточка 1 из 5</div>

        <!-- Контейнер для 3D-карточки -->
        <div id="cardContainer" class="card-container mb-8">
            <div id="flashcard" class="card" onclick="flipCard()">
                <!-- Передняя сторона (Термин) -->
                <div id="cardFront" class="card-face card-front bg-gradient-to-br from-blue-900 to-gray-900 text-white">
                    <span class="text-3xl font-bold">Что такое Base?</span>
                </div>

                <!-- Задняя сторона (Определение/Перевод) -->
                <div id="cardBack" class="card-face card-back bg-gray-900 text-blue-100 border-2 border-blue-500">
                    <span class="text-xl font-medium">Безопасный, недорогой блокчейн Ethereum L2, инкубируемый Coinbase</span>
                </div>
            </div>
        </div>

        <!-- Кнопки навигации -->
        <div class="flex justify-between space-x-3">
            <button id="prevBtn" onclick="navigate(-1)" disabled class="flex-1 py-3 px-4 bg-gray-800 text-gray-400 font-semibold rounded-xl border border-blue-500/20 hover:bg-gray-700 disabled:opacity-30 transition">
                ← Назад
            </button>
            <button onclick="flipCard()" class="flex-1 py-3 px-4 bg-blue-600 hover:bg-blue-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 transition">
                Перевернуть
            </button>
            <button id="nextBtn" onclick="navigate(1)" class="flex-1 py-3 px-4 bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold rounded-xl shadow-lg shadow-blue-500/20 disabled:opacity-30 transition">
                Вперед →
            </button>
        </div>
    </div>

    <script type="module">
        const cards = [
            { front: "Что такое Base?", back: "Безопасный, недорогой Ethereum L2 блокчейн, созданный Coinbase." },
            { front: "Какое основное преимущество для Builder'ов?", back: "Получение вознаграждений за разработку (Builder Rewards) и низкие комиссии." },
            { front: "На каком стеке технологий построена Base?", back: "На базе OP Stack вместе с оптимистичными роллапами." },
            { front: "Какая валюта используется для оплаты газа в Base?", back: "Ethereum (ETH)" },
            { front: "Как называется экосистемный токен-стандарт или сеть?", back: "Base Mainnet — экосистема для ончейн-миллиардов пользователей." }
        ];

        let currentCardIndex = 0;
        const cardContainer = document.getElementById('cardContainer');
        const cardFront = document.getElementById('cardFront');
        const cardBack = document.getElementById('cardBack');
        const progressDisplay = document.getElementById('progressDisplay');
        const prevBtn = document.getElementById('prevBtn');
        const nextBtn = document.getElementById('nextBtn');
        
        function updateCardContent() {
            const card = cards[currentCardIndex];
            cardFront.querySelector('span').textContent = card.front;
            cardBack.querySelector('span').textContent = card.back;
            cardContainer.classList.remove('is-flipped');
            progressDisplay.textContent = `Карточка ${currentCardIndex + 1} из ${cards.length}`;
            prevBtn.disabled = currentCardIndex === 0; 
            nextBtn.disabled = currentCardIndex === cards.length - 1;
        }

        window.flipCard = function() {
            cardContainer.classList.toggle('is-flipped');
        }
        
        window.navigate = function(direction) {
            let newIndex = currentCardIndex + direction;
            if (newIndex >= 0 && newIndex < cards.length) {
                currentCardIndex = newIndex;
                updateCardContent();
            }
        }

        updateCardContent();
    </script>
</body>
</html>

                    </div>

                    <button onclick="checkout()" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-700 hover:to-indigo-700 text-white font-bold py-3 px-4 rounded-xl shadow-lg transition">
                        Оплатить в сети Base 🚀
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        let cart = [];
        let total = 0;

        function showCategory(category) {
            document.querySelectorAll('.category-content').forEach(c => c.classList.add('hidden'));
            document.getElementById(category).classList.remove('hidden');
            document.querySelectorAll('.category-tab').forEach(t => {
                t.classList.remove('category-active', 'border-blue-500');
                t.classList.add('bg-gray-900/60', 'text-gray-300');
            });
            const activeTab = document.getElementById(`tab-${category}`);
            activeTab.classList.add('category-active', 'border-blue-500');
            activeTab.classList.remove('bg-gray-900/60', 'text-gray-300');
        }

        function addToCart(name, price) {
            const item = cart.find(i => i.name === name);
            if (item) item.quantity += 1;
            else cart.push({ name, price, quantity: 1 });
            updateCartDisplay();
        }

        function removeFromCart(index) {
            cart.splice(index, 1);
            updateCartDisplay();
        }

        function updateCartDisplay() {
            const container = document.getElementById('cart-items');
            const totalEl = document.getElementById('total-price');
            if (cart.length === 0) {
                container.innerHTML = '<div class="text-center text-gray-500 py-8"><p>Корзина пуста</p><p class="text-xs mt-1 text-gray-400">Выберите блюда для транзакции</p></div>';
                total = 0;
            } else {
                container.innerHTML = cart.map((i, idx) => `
                    <div class="cart-item bg-gray-800/80 border border-blue-500/20 rounded-xl p-3 flex justify-between items-center">
                        <div>
                            <h4 class="text-sm font-medium text-white">${i.name}</h4>
                            <span class="text-xs text-blue-400 font-mono">${i.price} ETH x ${i.quantity}</span>
                        </div>
                        <button onclick="removeFromCart(${idx})" class="text-red-400 hover:text-red-300 text-xs px-2 py-1">✕</button>
                    </div>
                `).join('');
                total = cart.reduce((sum, i) => sum + (i.price * i.quantity), 0);
            }
            totalEl.textContent = `${total.toFixed(4)} ETH`;
        }

        function connectWallet() {
            const btn = document.getElementById('wallet-btn');
            btn.innerHTML = '<span>🟢 0x71C...3aF2</span>';
            btn.classList.remove('bg-blue-600', 'hover:bg-blue-700');
            btn.classList.add('bg-green-600');
        }

        function checkout() {
            if(cart.length === 0) {
                alert('Корзина пуста!');
                return;
            }
            alert('Транзакция отправлена в сеть Base! Builder reward учтен 🎉');
            cart = [];
            updateCartDisplay();
        }
    </script>
</body>
</html>
